# Drei - local production stack.
#
#   cp .env.example .env      # then edit the secrets and set PUBLIC_URL
#   docker compose up --build
#
# Only the frontend publishes a port. The backend and Postgres are reachable
# solely on the internal Compose network, which is what makes the backend's
# trust of the X-Drei-Git-User header sound: the frontend is the only process
# that can reach it, and the frontend is the only process that sets that
# header.
#
# Startup order is enforced, not hoped for:
#
#   postgres (healthy)  ->  migrate (runs to completion)  ->  backend (healthy)  ->  frontend
#
# The migrate step is not optional. backend/internal/database/migrate.go issues
# ALTER TABLE "user" and log.Fatal()s on failure, so better-auth's schema has
# to exist before the backend boots. See client/better-auth_migrations/.
#
# PUBLIC_URL has no default anywhere in this file. It is the origin better-auth
# trusts, so a default would either be wrong - and sign-in would fail with
# "Invalid origin" on every address except the default - or mask the fact that
# the deployment was never told how it is reached.

name: drei

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-drei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-drei}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Named user and db, so this reports the real readiness of this instance
      # rather than the default postgres/postgres pair.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drei} -d ${POSTGRES_DB:-drei}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    # Deliberately no ports:. Postgres stays on the internal network.

  # ---------------------------------------------------------------------------
  # One-shot schema initialisation for the tables better-auth owns: user,
  # session, account, verification.
  #
  # This applies the project's existing migration files in
  # client/better-auth_migrations/ rather than introducing a second migration
  # system. Every file there is idempotent, so this is safe on every
  # `up` and a no-op once the schema exists. The remaining ~19 tables and the
  # extra "user" columns are created by the backend's own migrate.go at boot.
  # ---------------------------------------------------------------------------
  migrate:
    image: postgres:17
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-drei}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-drei}
    volumes:
      - ./client/better-auth_migrations:/migrations:ro
    entrypoint:
      - /bin/sh
      - -ec
      - |
        for f in /migrations/*.sql; do
          echo "[migrate] applying $${f}"
          psql -v ON_ERROR_STOP=1 -f "$${f}"
        done
        echo "[migrate] schema is up to date"

  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: "3200"
      # 0.0.0.0 inside the container so the frontend can reach it. The port is
      # not published to the host, so it is not reachable from outside the
      # Compose network.
      BIND_ADDR: 0.0.0.0
      REPOS_PATH: /var/lib/drei/repos
      GIT_HTTP_BACKEND: /usr/lib/git-core/git-http-backend
      APP_ENV: production
      # "postgres" is the Compose service name, not localhost: each container
      # has its own loopback.
      DATABASE_URL: postgres://${POSTGRES_USER:-drei}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-drei}
      # The backend validates every session by calling the client's
      # /api/auth/get-session, so this must resolve to the frontend container.
      CLIENT_URL: http://frontend:3000
    volumes:
      # Bare repositories, uploaded logos, issue and pull request images,
      # organization avatars and the bundled backups all live under
      # REPOS_PATH, so this one volume is the application's persistent state.
      - drei_data:/var/lib/drei
    # Deliberately no ports:.

  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./client
      args:
        # Build-time only. Nothing in the bundle captures it - vite does not
        # inline non-VITE_ process.env reads - and the runtime value below is
        # what client/src/lib/auth.ts actually uses. It is passed here so a
        # build never has to invent an address of its own.
        BETTER_AUTH_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PORT: "3000"
      HOST: 0.0.0.0
      # "backend" is the Compose service name.
      BACKEND_URL: http://backend:3200

      # The address users type. better-auth validates every sign-in and sign-up
      # against exactly this origin and binds the session cookie to it, so it is
      # the only thing that makes the LAN address work.
      #
      # Required, with no default: a default is what silently produces "Invalid
      # origin" everywhere except on the default address. PUBLIC_URL and
      # BETTER_AUTH_URL are the same value under two names, and the frontend
      # refuses to start if they disagree, because better-auth can only trust one
      # of them.
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env, e.g. http://192.168.1.10:3000}
      BETTER_AUTH_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env, e.g. http://192.168.1.10:3000}

      # Extra origins, comma separated, for a deployment that is legitimately
      # reachable under more than one address (a domain and a VPN hostname, say).
      # better-auth appends these to the origin above. Empty is the normal case:
      # the public origin is the whole list.
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-}

      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      DB_HOST: postgres://${POSTGRES_USER:-drei}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-drei}

      # Credentials for git over HTTP. `git` does not send a browser session
      # cookie, so without these, pushing is impossible. Leave them unset and
      # /git/ falls back to session-only authentication.
      GIT_BASIC_AUTH_USER: ${GIT_BASIC_AUTH_USER:-}
      GIT_BASIC_AUTH_PASSWORD: ${GIT_BASIC_AUTH_PASSWORD:-}
    ports:
      - "${PUBLIC_PORT:-3000}:3000"

volumes:
  postgres_data:
  drei_data:
