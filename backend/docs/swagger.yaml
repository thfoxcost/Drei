host: localhost:3200
info:
  contact: {}
  description: API for Drei, a self-hosted Git repository platform
  title: Drei API
  version: 1.0.0
paths:
  /contribution:
    get:
      description: Returns demo contribution data from data/contribution.json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get contribution data
      tags:
      - System
  /git/{owner}/{repo}.git:
    get:
      description: Passthrough to git-http-backend CGI for git clone/push operations
      parameters:
      - description: Repository owner
        in: path
        name: owner
        required: true
        type: string
      - description: Repository name (with .git suffix)
        in: path
        name: repo
        required: true
        type: string
      - description: Git CGI query parameters
        in: query
        name: '*'
        type: string
      produces:
      - application/x-git-upload-pack-result
      responses:
        "200":
          description: OK
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Git HTTP backend
      tags:
      - Git
    post:
      description: Passthrough to git-http-backend CGI for git clone/push operations
      parameters:
      - description: Repository owner
        in: path
        name: owner
        required: true
        type: string
      - description: Repository name (with .git suffix)
        in: path
        name: repo
        required: true
        type: string
      - description: Git CGI query parameters
        in: query
        name: '*'
        type: string
      produces:
