      responses:
        "200":
          description: OK
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Git HTTP backend
      tags:
      - Git
  /issues:
    get:
      description: Returns issues from all repositories with optional filters for
        state, author, assignee, search, label, and sort
      parameters:
      - description: Issue state filter (open or closed)
        in: query
        name: state
        type: string
      - description: Author user ID
        in: query
        name: author
        type: string
      - description: Assignee user ID
        in: query
        name: assignee
        type: string
      - description: Search term (matches title, description, number)
        in: query
        name: search
        type: string
      - description: Label name
        in: query
        name: label
        type: string
      - description: Sort order (newest, oldest, recently-updated, etc.)
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: List all issues across repositories
      tags:
      - Issues
