name: Super Linter

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  statuses: write
  issues: write
  pull-requests: write

jobs:
  super-linter:
    name: Super Linter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Super-Linter
        uses: super-linter/super-linter@v8.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Only check changed files in PRs
          VALIDATE_ALL_CODEBASE: false

          # Default branch
          DEFAULT_BRANCH: main

          # Enable only the languages used by Drei
          # Go is linted at the module level (golangci-lint run) so changed
          # files are not passed as named files from multiple packages
          VALIDATE_GO_MODULES: true
          VALIDATE_TYPESCRIPT_ES: true
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_JSON: true
          VALIDATE_YAML: true
          VALIDATE_MARKDOWN: true
          VALIDATE_DOCKERFILE: true
          VALIDATE_BASH: true
